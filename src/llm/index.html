<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="description" content="LLM Atlas：从数学与神经网络出发，通过双语图文和可计算实验理解大语言模型。" />
    <link rel="icon" type="image/webp" href="./images/neural-network-zh.webp" />
    <title>LLM Atlas · 从基础理解大语言模型</title>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem('llm-atlas-preferences-v1') || '{}');
        const dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.lang = p.locale === 'en' ? 'en' : 'zh-CN';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
