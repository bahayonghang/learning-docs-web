name: LLM Atlas verification

on:
  pull_request:
    paths:
      - 'src/llm/**'
      - '.github/workflows/llm-atlas.yml'
  push:
    branches: [main]
    paths:
      - 'src/llm/**'
      - '.github/workflows/llm-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/llm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/llm/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Export the Chinese and English course books
        run: npm run export:book
      - name: Verify numerical behavior and course integrity
        run: npm test
      - name: Typecheck and build the site
        run: npm run build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile browser behavior
        run: npm run test:e2e
      - name: Keep browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-atlas-browser-results
          path: src/llm/test-results/
          retention-days: 7
