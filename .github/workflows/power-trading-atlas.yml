name: Power Trading Atlas verification

on:
  pull_request:
    paths:
      - 'src/power-trading/**'
      - '.github/workflows/power-trading-atlas.yml'
  push:
    branches: [main]
    paths:
      - 'src/power-trading/**'
      - '.github/workflows/power-trading-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/power-trading
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/power-trading/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Export both editions and verify calculations, content, types and build
        run: npm run check
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile browser behavior
        run: npm run test:e2e
      - name: Keep browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-trading-atlas-browser-results
          path: src/power-trading/test-results/
          retention-days: 7
      - name: Keep the independently built static site
        uses: actions/upload-artifact@v4
        with:
          name: power-trading-atlas-site
          path: src/power-trading/dist/
          retention-days: 7
